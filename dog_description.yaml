      visual_tuning: false
      value: 0.038
    root_up_m:
      visual_tuning: false
      value: 0.014
    neck_length_m:
      visual_tuning: false
      value: 0.078
    hinge_half_gap_m:
      visual_tuning: false
      value: 0.012
    jaw_length_m:
