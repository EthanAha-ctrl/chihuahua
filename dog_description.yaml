    value: 0.5
  waist_joint_spacing_m:
    visual_tuning: true
    value: 0.08
  body_half_width_m:
    visual_tuning: false
    value: 0.075
  hip_half_width_m:
    visual_tuning: false
    value: 0.105
  foot_x_offset_m:
    visual_tuning: false
    value: 0.0
  foot_lateral_outset_m:
    visual_tuning: false
    value: 0.045
  min_reach_xy_m:
    visual_tuning: false
    value: 0.015
  max_reach_xy_m:
    visual_tuning: false
    value: 0.165
  min_foot_clearance_m:
    visual_tuning: false
    value: 0.080

viewer:
  body_z_m:
    visual_tuning: false
    value: 0.245
  links_m:
