# Link-only dog/robot description for the endpoint geometry viewer.
# No physics. No contact model. No controller. No solid body rendering.

name: digitigrade_yaw_pitch_waist_dog

sources:
  mixed_breed_limb_bones:
    url: "https://pmc.ncbi.nlm.nih.gov/articles/PMC8280978/"
    summary: >
      Mixed breed dog long-bone data, not Chihuahua-specific. Reported
      left/right lengths: humerus 16.93/17.55 cm, radius 18.30/18.15 cm,
      femur 19.02/19.40 cm, tibia 18.90/20.03 cm. No toe/metacarpal/
      metatarsal/phalange segment length is provided.
  chihuahua_joint_motion:
    url: "https://papers.ssrn.com/sol3/papers.cfm?abstract_id=5098946"
    summary: >
      Chihuahua study found, but it is Grade III medial patellar luxation,
      not a complete healthy Chihuahua baseline for all leg joints.
  general_canine_rom:
    url: "https://catalogimages.wiley.com/images/db/pdf/9781118711361.excerpt.pdf"
    summary: >
      General canine passive ROM fallback. Table 1.2 reports hip, stifle,
      tarsus, shoulder, elbow, and carpus flexion/extension values.
  small_breed_rom_cross_check:
    url: "https://www.frontiersin.org/articles/10.3389/fvets.2019.00424/full"
    summary: >
      Healthy French Bulldog goniometry cross-check: hip ROM about 121-123
      deg, stifle ROM about 114-115 deg, tarsus ROM about 149 deg.
  unitree_go2_fallback:
    url: "https://github.com/unitreerobotics/unitree_ros/blob/master/robots/go2_description/urdf/go2_description.urdf"
    summary: >
      Robot fallback only. Go2 has hip/thigh/calf revolute limits, but its
      foot joint is fixed, so it is not a source for our distal endpoint joint.
  canine_cervical_note:
    url: "https://pubmed.ncbi.nlm.nih.gov/2263970/"
    summary: >
      Canine cervical cadaver study reports intact C4-C5 flexion-extension ROM
      of 24.5 +/- 6.6 deg at 1 N-m. This is one vertebral motion unit, not a
      complete healthy Chihuahua whole-neck ROM.
  digitigrade_endpoint_note:
    url: "https://www.britannica.com/science/digitigrade-posture"
    summary: >
      Dogs and cats are digitigrade: only the phalanges touch while ankle/wrist
      are elevated. This is the intended analogy for the robot distal endpoint
      joint, not a tarsus/hock joint.

geometry:
  body_length_total_m:
    visual_tuning: true
    value: 0.64
  front_body_fraction:
