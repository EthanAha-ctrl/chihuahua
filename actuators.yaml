# Stage 1 actuator catalog placeholders.
# Torque and thermal numbers must be replaced with real datasheets before CAD lock-in.

default_actuator_set:
  waist_yaw: compact_servo_2nm
  waist_pitch: compact_servo_2nm
  hip_ab: compact_servo_2nm
  hip_pitch: compact_servo_2nm
  knee_bend: compact_servo_2nm
  toe_bend: micro_servo_0_4nm
